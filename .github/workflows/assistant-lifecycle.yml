name: Assistant lifecycle verification
on:
  push:
    branches: [codex/assistant-lifecycle]
    paths-ignore: ['temp/**', '.github/workflows/assistant-apply.yml']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: assistant-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: assistant_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assistant_test
      ASSISTANT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: agent-api/package-lock.json}
      - run: bash scripts/ci/assistant-lifecycle.sh
