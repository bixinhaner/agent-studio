name: Assistant lifecycle verification
on:
  push:
    branches: [codex/assistant-lifecycle]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/codex/assistant-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the reviewed source snapshot
        run: tar --exclude=.git -czf /tmp/assistant-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-source
          path: /tmp/assistant-source.tgz
          retention-days: 1
