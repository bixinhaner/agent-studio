<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Studio</title>
    <script>
      // Dark-mode portal users would otherwise see a white loading screen until React
      // applies the theme. Mirrors features/portal/roadmap/portal-theme-boot.ts.
      (function () {
        try {
          var path = location.pathname.replace(/\/+$/, "");
          if (path !== "" && path !== "/training") return;
          if (location.hash.indexOf("#admin/") === 0) return;
          var preference = window.localStorage.getItem("agent-studio.portal.theme.v1");
          var dark =
            preference === "dark" ||
            (preference === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (!dark) return;
          document.documentElement.setAttribute("data-portal-theme-boot", "dark");
          document.documentElement.style.backgroundColor = "#141518";
          document.documentElement.style.colorScheme = "dark";
        } catch (_error) {}
      })();
    </script>
    <script>
      (function () {
        var storageKey = "agent-studio-public-branding";

        function asString(value) {
          return typeof value === "string" ? value.trim() : "";
        }

        function setFavicon(assetUrl) {
          var normalized = resolveBrandingAssetUrl(assetUrl);
          var link = document.querySelector('link[rel~="icon"]');
          if (!normalized) {
            if (link) link.removeAttribute("href");
            return;
          }
          if (!link) {
            link = document.createElement("link");
            link.rel = "icon";
            document.head.appendChild(link);
          }
          link.href = normalized;
        }

        function setAuthBackground(assetUrl) {
          var normalized = resolveBrandingAssetUrl(assetUrl);
          document.documentElement.style.setProperty(
            "--auth-brand-background-image",
            normalized ? "url(" + JSON.stringify(normalized) + ")" : "none"
          );
        }

        function apiBase() {
          var configured = asString(window.__AGENT_STUDIO_API_BASE__);
          if (configured) {
            return configured.replace(/\/+$/, "");
          }
          if (
            (location.hostname === "127.0.0.1" || location.hostname === "localhost") &&
            (location.port === "5173" || location.port === "5179")
          ) {
            return "http://127.0.0.1:8787";
          }
          return "";
        }

        function resolveBrandingAssetUrl(assetUrl) {
          var normalized = asString(assetUrl);
          if (!normalized) return "";
          if (/^[a-z][a-z\d+\-.]*:/i.test(normalized) || normalized.indexOf("//") === 0) return normalized;
          if (normalized.indexOf("/public-api/branding/assets/") !== 0) return normalized;
          var base = apiBase();
          return base ? base + normalized : normalized;
        }

        function applyBranding(payload) {
          var branding = payload && typeof payload === "object" && payload.branding && typeof payload.branding === "object"
            ? payload.branding
            : payload;
          if (!branding || typeof branding !== "object") return;
          var platformName = asString(branding.platformName) || "Agent Studio";
          var iconUrl = asString(branding.iconUrl) || asString(branding.logoUrl);
          var backgroundAsset =
            asString(branding.loginBackgroundUrl) || asString(branding.logoUrl) || asString(branding.iconUrl);
          document.title = platformName;
          setFavicon(iconUrl);
          setAuthBackground(backgroundAsset);
        }

        try {
          var cached = window.localStorage.getItem(storageKey);
          if (cached) {
            applyBranding(JSON.parse(cached));
          }
        } catch (_error) {}

        var brandingApiBase = apiBase();
        fetch(brandingApiBase + "/public-api/branding", { credentials: brandingApiBase ? "include" : "same-origin" })
          .then(function (response) {
            return response.ok ? response.json() : null;
          })
          .then(function (payload) {
            if (!payload) return;
            try {
              window.localStorage.setItem(storageKey, JSON.stringify(payload));
            } catch (_error) {}
            applyBranding(payload);
          })
          .catch(function () {});
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
